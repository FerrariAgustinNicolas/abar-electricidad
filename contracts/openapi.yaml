      summary: Edit name or active state using optimistic concurrency
      description: |
        At least one of name/active is required, plus expectedVersion >= 1. Email and
        password are not patchable. Increment version atomically on successful mutation;
        stale version is 409. Deactivation revokes all target sessions, including self.
        Serialize last-active protection so concurrent writes cannot leave zero active admins.
      security: [{AdminSessionCookie: []}]
      parameters:
