openapi: 3.0.3
info:
  title: ABAR Electricidad API — transversal candidate
  version: 0.9.0
  x-abar-h6-freeze: notifications-settings-v1
  x-abar-h6-runtime-stage: contract-frozen-implementation-pending
  x-abar-h5-freeze: manual-confirmation-v1
  x-abar-h5-runtime-stage: implemented-local-verification-pending
  x-abar-h5-decisions:
    P01: user-confirmed-academic-unpaid-only-cancellation
  x-abar-h4-freeze: orders-demo-v1
  x-abar-h4-runtime-stage: implemented-local-verification-pending
  x-abar-h4-decisions:
    P02: user-confirmed-academic-no-commercial-expiry
    P03: user-confirmed-academic-buyer-and-versioned-demo-terms
  x-abar-h3-freeze: cart-quote-v1
  x-abar-h2-freeze: catalog-stock-v1
  x-abar-h2-runtime-stage: implemented-audit-pending
  x-abar-milestone: H1-contract-freeze
  x-abar-runtime-stage: h0
  # Legacy freeze markers above remain required by the integrated static validator.
  x-abar-integrated-runtime-stage: h1
  x-abar-integrated-commit: 18c39e9b86b7b7bf45263fe5bad4fe77125a6386
  description: |
    Single normative candidate contract, version 0.9.0. H6 is frozen before implementation. H1–H5 are academically integrated with recorded verification debt; this is not production approval. H4 guest orders/demo attempts extend H3 additively. H2 catalog/stock schemas are frozen;
    local H2 implementation and bounded independent checks are recorded in H2-informe.md.
    External milestone audit remains pending; this metadata is not production approval. H1 authentication and
    administrative-user operations are integrated alongside GET /health at the
    commit identified above. No external approval or production readiness is implied.
    The h0 runtime marker and projected-area list are historical freeze metadata,
    retained for validator compatibility, not current runtime availability claims.
    Historical H0 projected metadata below is retained; scoped H4 P02/P03 academic confirmations are explicit in x-abar-h4-decisions. That historical H4 marker is not a current availability statement; H4/H5 academic integration and debt are recorded in milestone reports.
    All H1 responses use Cache-Control: no-store. No passwords, cookie values or runtime
    nonces are provided as examples. Required response headers use x-required: true.
    Cookie authentication does not replace Origin/CSRF checks. See docs/decisions/H1-auth.md.
  x-abar-contract-status: candidate
  x-abar-projected-areas:
    - /api/v1/public
    - /api/v1/auth
    - /api/v1/admin
  x-abar-examples:
    - file: examples/h6-settings-write.json
      schema: H6SettingsWrite
    - file: examples/h6-payment-method-write.json
      schema: H6PaymentMethodWrite
    - file: examples/h6-notification-retry.json
      schema: H6NotificationRetry
    - file: examples/h5-confirmation-request.json
      schema: PaymentConfirmationRequest
    - file: examples/h4-order-request.json
      schema: CreateOrderRequest
    - file: examples/h3-quote-request.json
      schema: QuoteRequest
    - file: examples/h2-product.json
      schema: ProductDetail
    - file: examples/h2-product-write.json
      schema: ProductWrite
    - file: examples/h2-roll-opening.json
      schema: StockOperationView
    - file: examples/health-ok.json
      schema: HealthOk
    - file: examples/health-unavailable.json
      schema: ApiError
    - file: examples/money-ars.json
      schema: Money
    - file: examples/admin-session.json
      schema: AdminSessionView
    - file: examples/admin-user.json
      schema: AdminUserView
    - file: examples/admin-users.json
      schema: AdminUserList
    - file: examples/auth-error.json
      schema: ApiError
servers:
  - url: http://localhost:3000
    description: Local development only; production transport must use HTTPS.
security: []
tags:
  - name: commercial-admin
    description: H6 authenticated DEMO settings and notification operations.
  - name: commercial-public
    description: Minimal DEMO contact only; no private administrative data.
  - name: orders-admin
    description: H5 academically integrated manual operations; verification debt is recorded separately.
  - name: checkout-public
    description: H3 public demo quotes; no order, payment or reservation.
  - name: catalog-public
    description: Frozen H2 public catalog; no exact stock balances.
  - name: catalog-admin
    description: Frozen H2 catalog and stock; H1 session and CSRF.
  - name: operational
    description: Implemented operational endpoint, outside the commercial /api/v1 prefix.
  - name: projected
    description: Candidate components and conventions only; no business operations are implemented.
  - name: auth
    description: Integrated H1 session protocol; validation evidence is tracked separately.
  - name: admin
    description: Frozen H1 administrative users; equal capabilities, no roles.
