            schema: {$ref: '#/components/schemas/PatchAdminUserRequest'}
      x-abar-errors:
        '400': [VALIDATION_ERROR]
        '401': [SESSION_EXPIRED]
        '403': [PASSWORD_CHANGE_REQUIRED, ORIGIN_INVALID, CSRF_INVALID]
        '404': [USER_NOT_FOUND]
        '409': [VERSION_CONFLICT, LAST_ACTIVE_ADMIN]
        '503': [SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: Sanitized updated user and incremented version.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserView'}
