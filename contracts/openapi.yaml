  /api/v1/admin/orders/{id}/payment-confirmation:
    post:
      tags:
        - orders-admin
      operationId: confirmOrderPayment
      summary: confirmOrderPayment
      security:
        - AdminSessionCookie: []
      description: Frozen H5 operation, not implemented at freeze. H1 authority revalidated inside transaction.
        expectedVersion is Order.version (order/payment/current-attempt/notes aggregate), incremented exactly once per new
        mutation; replay does not increment. Only confirmation can set PAID/PREPARING or debit stock. Paid cancellation is
        forbidden.
      parameters:
        - name: id
          in: path
          required: true
          description: Order identity.
          schema:
            $ref: "#/components/schemas/OpaqueId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfToken"
        - name: Idempotency-Key
          in: header
          required: true
          description: "16–200 ASCII letters, digits, underscore or hyphen. Scope: operation + order + authenticated actor; same
            normalized body returns original response before version check. Different body conflicts. No automatic
            replacement key after timeout."
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,200}$
      x-abar-errors:
