  /api/v1/auth/csrf:
    get:
      tags: [auth]
      operationId: getAuthCsrf
      summary: Obtain stateful CSRF metadata
      description: |
        Anonymous: create/reuse a separate 15-minute pre-auth context, with hashed
        random context ID and independently random recoverable nonce in PostgreSQL.
        Authenticated: return the same session-bound nonce, without per-request rotation.
        mustChangePassword sessions receive 403 PASSWORD_CHANGE_REQUIRED; reload uses me.
        Both identifiers and nonces use CSPRNG 32 bytes encoded base64url. Nonces are
        not authentication credentials alone. Frontend keeps CSRF in memory only.
      security: [{}, {AdminSessionCookie: []}]
      x-abar-errors:
        '403': [PASSWORD_CHANGE_REQUIRED]
        '429': [RATE_LIMITED]
        '503': [SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: CSRF metadata; anonymous responses set/reuse the pre-auth cookie only.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Set-Cookie: {$ref: '#/components/headers/PreauthCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfMetadata'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginAdmin
      summary: Authenticate and rotate session
      description: |
        Validate exact configured Origin and CSRF bound to the pre-auth context (or
        an ordinary active session). A successful login destroys the pre-auth context,
        clears its cookie and rotates session ID and CSRF nonce. Restricted sessions
        may use only me/change-password/logout. Nonexistent, wrong-password and inactive
        accounts receive identical INVALID_CREDENTIALS errors with equivalent password
        verification work. IP 10/60s and normalized account 10/15min, per-process limits.
        Login accepts password length 1–128 to allow generic incorrect verification;
        apply NFC consistently without trimming whitespace or truncating.
      security: [{AuthPreauthCookie: []}, {AdminSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      x-abar-errors:
        '400': [VALIDATION_ERROR]
        '401': [INVALID_CREDENTIALS]
        '403': [ORIGIN_INVALID, CSRF_INVALID, PASSWORD_CHANGE_REQUIRED]
        '429': [RATE_LIMITED]
        '503': [SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: Sanitized identity and expiration, rotated session cookie and nonce header.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
            X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSessionView'}
              examples:
                session: {externalValue: ./examples/admin-session.json}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getAdminSession
      summary: Restore sanitized session, including mandatory-change sessions
      description: |
        Check active account and session expiry/revocation/server state every time.
        Return the existing bound CSRF nonce in the header, not the JSON identity DTO.
        A stale tab may refresh me for a future explicit user retry, never automatically
        retry writes. Session rotation invalidates old tabs; no per-request nonce churn.
      security: [{AdminSessionCookie: []}]
      x-abar-errors:
        '401': [SESSION_EXPIRED]
        '503': [SERVICE_UNAVAILABLE]
      responses:
        '200':
          description: Session view; mandatory-change reload obtains nonce from this header.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSessionView'}
              examples:
                session: {externalValue: ./examples/admin-session.json}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logoutAdmin
      summary: Revoke active session or safely clear a stale cookie
      description: |
        ALWAYS validate Origin. Active session: require its bound CSRF, revoke and clear.
        Missing/unknown/expired/revoked/malformed cookie with NO active session: clear
        stale cookie and return 204, no session mutation or pre-auth proof required.
        A database failure is 503, never treated as absence. Never resurrect sessions.
      security: [{}, {AdminSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - name: X-CSRF-Token
          in: header
          required: false
          description: Required exactly when there is an active session; bound to that session.
          schema: {$ref: '#/components/schemas/CsrfNonce'}
      x-abar-errors:
        '403': [ORIGIN_INVALID, CSRF_INVALID]
        '503': [SERVICE_UNAVAILABLE]
      responses:
        '204':
          description: Session revoked or no active session; matching session cookie attributes cleared.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Set-Cookie: {$ref: '#/components/headers/ClearSessionCookie'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      operationId: changeAdminPassword
      summary: Change own password, rotate current session and revoke others
      description: |
        Allowed with mustChangePassword. Verify current password generically, validate
        new password policy, atomically clear mandatory change, revoke other sessions
        and renew current session ID/CSRF. Return no JSON body; consume renewed header.
      security: [{AdminSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      x-abar-errors:
        '400': [VALIDATION_ERROR, PASSWORD_POLICY]
        '401': [SESSION_EXPIRED, INVALID_CREDENTIALS]
        '403': [ORIGIN_INVALID, CSRF_INVALID]
        '503': [SERVICE_UNAVAILABLE]
      responses:
        '204':
          description: Password changed; other sessions revoked, current session renewed.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
            X-CSRF-Token: {$ref: '#/components/headers/CsrfToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
