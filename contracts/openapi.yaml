components:
  securitySchemes:
    OrderAccessToken:
      type: apiKey
      in: header
      name: X-Order-Access-Token
      description: Temporary per-order possession credential. Hash validation and expiry; no query or URL
        credential. Expiry never cancels order.
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: abar_admin_session
      description: |
        Frozen H1, runtime pending: opaque CSPRNG 32-byte base64url ID, SHA256 hash only
        stored in PostgreSQL. Host-only (no Domain), HttpOnly, SameSite=Lax, Path=/api/v1,
        explicit Expires and Max-Age; Secure on HTTPS, exception only loopback HTTP dev/test.
        Absolute 8-hour and idle 30-minute default limits. Validate account/session state
        server-side. Mutations also require exact Origin and stateful CSRF. No JWT/storage.
    AuthPreauthCookie:
      type: apiKey
      in: cookie
      name: abar_auth_context
      description: |
        Separate host-only HttpOnly cookie, Path=/api/v1/auth, SameSite=Lax, Secure on
        HTTPS (loopback HTTP dev/test exception), explicit Expires/Max-Age, TTL 15 minutes.
        Random 32-byte context ID hashed in PostgreSQL, independent stored random nonce.
        Not an authenticated session. Successful login destroys context and clears cookie.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: |
        Exact configured allowlist, never derived from request/Forwarded. Missing/null/
        mismatch is 403 ORIGIN_INVALID, no Referer fallback. Defaults are
        http://127.0.0.1:4200 and http://localhost:4200. Same-origin proxy expected;
        no arbitrary credentialed CORS. Tests may inject an explicitly owned local origin.
      schema: {type: string, minLength: 1}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Independent stateful nonce bound to context/session, never logged.
      schema: {$ref: '#/components/schemas/CsrfNonce'}
    UserId:
      name: id
      in: path
      required: true
      description: Opaque administrator UUID, never a sequence.
      schema: {$ref: '#/components/schemas/OpaqueId'}
  responses:
    BadRequest:
      description: 400 VALIDATION_ERROR or PASSWORD_POLICY as listed by the operation; no input values.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: 401 SESSION_EXPIRED or generic INVALID_CREDENTIALS as listed by operation.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
          examples:
            generic: {externalValue: ./examples/auth-error.json}
    Forbidden:
      description: 403 ORIGIN_INVALID, CSRF_INVALID or PASSWORD_CHANGE_REQUIRED as listed by operation.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: 404 USER_NOT_FOUND; only authenticated unrestricted users reach target lookup.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: 409 EMAIL_IN_USE, VERSION_CONFLICT or LAST_ACTIVE_ADMIN as listed by operation.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    RateLimited:
      description: 429 RATE_LIMITED; uniform non-enumerating limit response.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unavailable:
      description: 503 SERVICE_UNAVAILABLE; dependency failure is never an absent session.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  headers:
    NoStore:
      x-required: true
      description: Required on every H1 response, including errors; no cache of identity/nonce.
      schema: {type: string, enum: [no-store]}
    CsrfToken:
      x-required: true
      description: Required on me/login 200 and change-password 204; same bound nonce until rotation.
      schema: {$ref: '#/components/schemas/CsrfNonce'}
    SessionCookie:
      x-required: true
      description: |
        Required rotated abar_admin_session cookie: host-only (no Domain), Path=/api/v1,
        HttpOnly, SameSite=Lax, explicit Expires/Max-Age; Secure on HTTPS, exception only
        loopback HTTP dev/test. Login also clears abar_auth_context using matching attributes.
        Multiple Set-Cookie headers are separate fields, never comma-joined. No value example.
      schema: {type: string}
    PreauthCookie:
      description: |
        Anonymous responses only: abar_auth_context, host-only, Path=/api/v1/auth,
        HttpOnly, SameSite=Lax, explicit Expires/Max-Age bounded by 15-minute TTL;
        Secure on HTTPS except loopback HTTP dev/test. No authenticated-session cookie here.
      schema: {type: string}
    ClearSessionCookie:
      x-required: true
      description: Clear abar_admin_session with matching path/attributes, Max-Age=0 and past Expires.
      schema: {type: string}
    RetryAfter:
      x-required: true
      description: Required nonnegative integer seconds before another attempt, not an HTTP date.
      schema: {type: integer, minimum: 0}
    IdempotencyKey:
      description: |
        Projected on critical mutation operations. Same key and same request replays the
        prior result; same key with a different request returns 409 IDEMPOTENCY_CONFLICT.
        H0 does not implement or reserve these operations.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    RequestId:
      description: Correlation identifier for the completed request.
      schema:
        type: string
        format: uuid
